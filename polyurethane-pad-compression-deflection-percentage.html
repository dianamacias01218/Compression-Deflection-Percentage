<style>
  .calculator-container {
    margin: 50px auto;
    width: 450px;
    border: 1px solid #fff;
    border-radius: 20px;
    background-color: #fff;
    padding: 24px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

  .calculator {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .calculator-title {
    text-align: center;
    color: #242021;
    font-family: "urw-din-condensed", sans-serif;
    font-weight: 600;
    font-size: 24px;
    margin-bottom: 10px;
  }

  .calculator-subtitle {
    text-align: center;
    color: #d3d3d3;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .calculator-label {
    color: #242021;
    font-weight: 600;
    font-size: 14px;
  }

  .calculator-select,
  .calculator-input,
  .calculator-button {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
  }

  .calculator-button {
    background-color: #da1f31;
    color: #fff;
    border: none;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .calculator-button:hover {
    background-color: #242021;
    color: #da1f31;
  }

  .calculator-refresh-button {
    width: 50%;
    align-self: flex-end;
  }

  #result {
    margin-top: 10px;
    font-weight: 600;
    color: #242021;
  }

  @media (max-width: 900px) {
    .calculator-container {
      width: 100%;
      margin: 20px auto;
    }
  }
</style>

<div class="calculator-container">
  <h3 class="calculator-title">
    Polyurethane Pad Compression Deflection Calculator
  </h3>

  <div class="calculator" id="compressionCalculator">

    <label class="calculator-label" for="load">Load (lbs):</label>
    <input type="number" id="load" class="calculator-input" placeholder="Enter load">

    <label class="calculator-label" for="width">Width (in):</label>
    <input type="number" id="width" class="calculator-input" placeholder="Enter width">

    <label class="calculator-label" for="length">Length (in):</label>
    <input type="number" id="length" class="calculator-input" placeholder="Enter length">

    <label class="calculator-label" for="thickness">Thickness (in):</label>
    <input type="number" id="thickness" class="calculator-input" placeholder="Enter thickness">

    <label class="calculator-label" for="material">Material Hardness:</label>
    <select id="material" class="calculator-select">
      <option value="40A">40A – 500 PSI</option>
      <option value="45A">45A – 550 PSI</option>
      <option value="50A">50A – 600 PSI</option>
      <option value="55A">55A – 700 PSI</option>
      <option value="60A">60A – 850 PSI</option>
      <option value="65A">65A – 1000 PSI</option>
      <option value="70A">70A – 1200 PSI</option>
      <option value="75A">75A – 1450 PSI</option>
      <option value="80A">80A – 1850 PSI</option>
      <option value="85A">85A – 2500 PSI</option>
      <option value="90A">90A – 4000 PSI</option>
      <option value="95A">95A – 11000 PSI</option>
      <option value="50D">50D – 11000 PSI</option>
      <option value="60D">60D – 28000 PSI</option>
      <option value="70D">70D – 90000 PSI</option>
    </select>

    <button class="calculator-button" onclick="calculateDeflection()">
      Calculate Deflection
    </button>

    <button class="calculator-button calculator-refresh-button" onclick="refreshCalculator()">
      Reset
    </button>

    <div id="result"></div>
  </div>
</div>

<script>
  function calculateDeflection() {
    const load = parseFloat(document.getElementById('load').value);
    const width = parseFloat(document.getElementById('width').value);
    const length = parseFloat(document.getElementById('length').value);
    const thickness = parseFloat(document.getElementById('thickness').value);
    const material = document.getElementById('material').value;

    if (!load || !width || !length || !thickness) {
      document.getElementById('result').innerHTML =
        "❗ Please enter valid positive numbers for all fields.";
      return;
    }

    const areaCompressed = width * length;
    const psi = load / areaCompressed;

    const modulusValues = {
      "40A": 500, "45A": 550, "50A": 600, "55A": 700, "60A": 850,
      "65A": 1000, "70A": 1200, "75A": 1450, "80A": 1850, "85A": 2500,
      "90A": 4000, "95A": 11000, "50D": 11000, "60D": 28000, "70D": 90000
    };

    const modulus = modulusValues[material];

    if (!modulus) {
      document.getElementById('result').innerHTML = "Invalid material selected.";
      return;
    }

    const areaBulge = (width + length) * 2 * thickness;
    const shapeFactor = areaCompressed / areaBulge;

    const deflectionPercent =
      (psi / (modulus * (1 + 2 * Math.pow(shapeFactor, 2)))) * 100;

    document.getElementById('result').innerHTML =
      `Deflection: <strong>${deflectionPercent.toFixed(2)}%</strong>`;
  }

  function refreshCalculator() {
    document.querySelectorAll('#compressionCalculator input').forEach(el => el.value = '');
    document.getElementById('material').value = '40A';
    document.getElementById('result').innerHTML = '';
  }
</script>
